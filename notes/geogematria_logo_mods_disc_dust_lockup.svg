<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:22px;font-weight:400;text-anchor:start;dominant-baseline:auto">The spherical triangulation mark shown three ways: inside a stamped benchmark survey disc, with its triangle edges replaced by a cantor set so the body is moth-eaten with voids, and beside a monospace geogematria wordmark.</desc>
