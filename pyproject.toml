[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geogematria"
version = "0.1.0"
description = "Local geographic projection layer for glossololary."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
backend = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
test = [
    "httpx>=0.27",
]

[project.scripts]
geogematria = "geogematria.cli:main"

[tool.setuptools]
packages = ["geogematria", "backend"]
include-package-data = false

[tool.setuptools.package-data]
geogematria = ["data/*.json", "data/*.md"]
