<svg width="260" height="260" viewBox="0 0 260 260" role="img" xmlns="http://www.w3.org/2000/svg">
<title>geogematria seal — dust-edged spherical mark in a benchmark disc</title>
<desc>The spherical triangulation glyph stamped inside a benchmark survey disc. Its triangle edges are a cantor set — solid, gap, solid, recursing — so the mark carries the projection's forbidden middle-thirds in its own body. Three sightlines converge on an off-center locus.</desc>

